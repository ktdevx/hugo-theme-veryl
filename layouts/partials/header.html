<header class="site-header">
  <div class="header-inner">
    <a class="site-brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav aria-label="メインナビゲーション">
      {{ $page := . }}
      {{ partial "theme-menu.html" (dict "class" "theme-menu--mobile") }}
      <button
        class="menu-toggle"
        type="button"
        data-nav-toggle
        aria-controls="site-menu"
        aria-expanded="false"
        aria-label="メニューを開く"
        title="メニューを開く"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
      <div class="nav-links" id="site-menu" data-nav-panel aria-hidden="false">
        {{ range site.Menus.main }}
          {{ $href := .URL }}
          {{ with .Page }}
            {{ $href = .RelPermalink }}
          {{ end }}
          <a href="{{ $href }}"{{ if or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
        {{ partial "theme-menu.html" (dict "class" "") }}
      </div>
    </nav>
  </div>
</header>
