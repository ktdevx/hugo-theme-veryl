{{ define "main" }}
  <header class="page-heading">
    <p class="eyebrow">{{ .Data.Plural }}</p>
    <h1>{{ .Title }}</h1>
  </header>
  <section class="listing" aria-label="{{ .Title }}の記事">
    {{ range .Paginator.Pages }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </section>
  {{ template "_internal/pagination.html" . }}
{{ end }}
