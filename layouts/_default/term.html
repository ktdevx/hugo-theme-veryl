{{ define "main" }}
  <header class="page-heading">
    <p class="eyebrow"><span class="material-symbols-outlined meta-icon" aria-hidden="true">label</span>{{ .Data.Plural }}</p>
    <h1>{{ .Title }}</h1>
  </header>
  <section class="listing" aria-label="{{ i18n "termArticlesLabel" (dict "Title" .Title) }}">
    {{ range .Paginator.Pages }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </section>
  {{ partial "pagination.html" . }}
{{ end }}
