<!doctype html>
<html lang="{{ site.Language.LanguageCode | default site.Language.Lang | default "ja" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#content">{{ i18n "skipToContent" }}</a>
    {{ partial "header.html" . }}
    <main>
      <div id="content" class="page-shell">
        {{ if and (ne site.Params.breadcrumbs false) (not .IsHome) (ne .Kind "404") }}
          {{ partial "breadcrumbs.html" . }}
        {{ end }}
        {{ block "main" . }}{{ end }}
      </div>
    </main>
    {{ partial "footer.html" . }}
    <script src="{{ "js/theme.js" | relURL }}" defer></script>
  </body>
</html>
