<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "ja" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#content">本文へ移動</a>
    {{ partial "header.html" . }}
    <main>
      <div id="content" class="page-shell">
        {{ block "main" . }}{{ end }}
      </div>
    </main>
    {{ partial "footer.html" . }}
    <script src="{{ "js/theme.js" | relURL }}" defer></script>
  </body>
</html>
